<!DOCTYPE html>

    <meta name="theme-color" content="#ffffff" id="meta-theme-color">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: { 
                    colors: { primary: '#e74c3c' },
                    animation: { 'fade-in': 'fadeIn 0.2s ease-out' },
                    keyframes: { fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } } }
                }
            }
        }
        function initTheme() {
            const isDark = localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark');
            updateMetaTheme(isDark);
        }
        function updateMetaTheme(isDark) {
            const metaTheme = document.getElementById('meta-theme-color');
            if (metaTheme) metaTheme.setAttribute('content', isDark ? '#111827' : '#ffffff');
        }
        initTheme();
    </script>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.2/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap');

        .gallery-card { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        @media (hover: hover) { .gallery-card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.12); } }
        .dark body { background-color: #111827; color: #f3f4f6; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #4b5563; }
        .modal-mobile-scroll { -webkit-overflow-scrolling: touch; }
        .header-hide { transform: translateY(-100%); }
        header { transition: transform 0.3s ease; }
        .bottom-sheet { border-top-left-radius: 20px; border-top-right-radius: 20px; }
        .break-inside-avoid { break-inside: avoid; }
    </style>
</head>

            <div class="flex gap-3">
                <button onclick="openCurrentImageSource()" class="text-white w-9 h-9 rounded-full bg-white/10 backdrop-blur-sm flex items-center justify-center active:scale-90 transition-transform border border-white/20"><i class="fas fa-external-link-alt text-sm"></i></button>
                <button onclick="closeFullImgModal()" class="text-white w-9 h-9 rounded-full bg-red-500/80 backdrop-blur-sm flex items-center justify-center active:scale-90 transition-transform border border-red-400/50"><i class="fas fa-times text-lg"></i></button>
            </div>
        </div>
        <div id="swipe-area" class="relative w-full h-full flex items-center justify-center overflow-hidden">
            <button onclick="prevFullImg(event)" class="hidden md:flex absolute left-4 z-20 text-white bg-black/50 hover:bg-black/80 w-12 h-12 rounded-full items-center justify-center transition-all backdrop-blur-sm"><i class="fas fa-chevron-left text-xl"></i></button>
            <img id="full-modal-target-img" src="" alt="Full Screen" class="max-w-full max-h-full object-contain shadow-2xl transition-transform duration-200 ease-out select-none" draggable="false">
            <button onclick="nextFullImg(event)" class="hidden md:flex absolute right-4 z-20 text-white bg-black/50 hover:bg-black/80 w-12 h-12 rounded-full items-center justify-center transition-all backdrop-blur-sm"><i class="fas fa-chevron-right text-xl"></i></button>
        </div>
        <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-30 flex items-center gap-2 bg-black/60 p-1.5 rounded-full backdrop-blur-sm border border-white/20 pb-safe">
            <button id="btn-play-slideshow" onclick="toggleSlideshow()" class="text-green-400 w-10 h-10 rounded-full flex items-center justify-center active:scale-90 transition-transform"><i id="play-icon" class="fas fa-play"></i></button>
            <div class="h-6 w-px bg-white/20"></div>
            <select id="slideshow-speed" class="bg-transparent text-white text-xs pl-2 pr-4 outline-none font-bold appearance-none" onchange="changeSlideshowSpeed()">
                <option value="2000">เร็ว (2s)</option><option value="4000" selected>ปกติ (4s)</option><option value="7000">ช้า (7s)</option>
            </select>
        </div>
    </div>

    <script>
        // --- 🚀 Base Setup ---
        let currentUrl = "https://www.jav321.com/"; let currentPage = 1; const TARGET_URL = 'https://www.jav321.com/';
        let currentImages = []; let activeMainTab = 'home'; let favoriteList = [];      
        let gasEndpoint = localStorage.getItem('gas_url') || 'https://script.google.com/macros/s/AKfycbw7P7lijJeFfv4ChzKaRUAy30g5jmD_0fKOq0yd43Lq1IdC8VgQBqlAYXXoBL8IE0n1/exec';
        let bookmarkList = []; let currentlyRenderedFavs = [];

        const pageCache = new Map(); let historyStack = [currentUrl]; let historyIndex = 0; let isNavigatingHistory = false; 
        let slideshowInterval = null; let slideshowActiveIndex = 0; let slideshowSpeed = 4000; let isModalDetailsOpen = false;

        function triggerHaptic(type = 'light') { if (navigator.vibrate) { if (type === 'light') navigator.vibrate(10); else if (type === 'medium') navigator.vibrate(30); } }
        function escapeQuotes(str) { return String(str || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"'); }
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container'); if (!container) return;
            const toast = document.createElement('div'); toast.className = `p-3 sm:p-4 rounded-xl shadow-lg border text-xs sm:text-sm font-bold transition-all duration-300 transform -translate-y-4 opacity-0 flex items-center gap-2.5 backdrop-blur-md`;
            let bgClass = 'bg-white/90 text-gray-800 dark:bg-gray-800/90 dark:text-gray-100'; let iconHtml = '<i class="fas fa-info-circle text-blue-500"></i>';
            if (type === 'success') { bgClass = 'bg-green-50/95 text-green-800 dark:bg-green-900/90 dark:text-green-200'; iconHtml = '<i class="fas fa-check-circle text-green-500"></i>'; } 
            else if (type === 'error') { bgClass = 'bg-red-50/95 text-red-800 dark:bg-red-900/90 dark:text-red-200'; iconHtml = '<i class="fas fa-times-circle text-red-500"></i>'; }
            toast.className += ` ${bgClass}`; toast.innerHTML = `${iconHtml} <span class="flex-1">${message}</span>`;
            container.appendChild(toast); triggerHaptic('light'); requestAnimationFrame(() => toast.classList.remove('-translate-y-4', 'opacity-0'));
            setTimeout(() => { toast.classList.add('-translate-y-4', 'opacity-0'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function openBottomSheet(id, inputId = null) { const modal = document.getElementById(id); const sheet = modal.querySelector('.bottom-sheet'); modal.classList.remove('hidden'); modal.classList.add('flex'); requestAnimationFrame(() => { modal.classList.remove('opacity-0'); sheet.classList.remove('translate-y-full'); if (inputId && window.innerWidth > 640) document.getElementById(inputId).focus(); }); triggerHaptic('light'); }
        function closeBottomSheet(id) { const modal = document.getElementById(id); const sheet = modal.querySelector('.bottom-sheet'); modal.classList.add('opacity-0'); sheet.classList.add('translate-y-full'); setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); }, 300); }
        function openSearchModal() { openBottomSheet('search-modal', 'search-modal-input'); } function closeSearchModal() { closeBottomSheet('search-modal'); }
        function executeModalSearch() { const val = document.getElementById('search-modal-input').value.trim(); if (val) { closeSearchModal(); switchMainTab('home'); loadPage(`${TARGET_URL}search?sn=${encodeURIComponent(val)}`); } }
        function openLinkInputModal() { openBottomSheet('link-modal', 'link-modal-input'); } function closeLinkInputModal() { closeBottomSheet('link-modal'); }
        function executeModalLink() { const val = document.getElementById('link-modal-input').value.trim(); if (val) { closeLinkInputModal(); switchMainTab('home'); loadPage(val.startsWith('http') ? val : 'https://' + val); } }
        
        document.addEventListener('keypress', (e) => { if (e.key === 'Enter') { if (!document.getElementById('search-modal').classList.contains('hidden')) executeModalSearch(); else if (!document.getElementById('link-modal').classList.contains('hidden')) executeModalLink(); } });
        function toggleTheme() { const isDark = document.documentElement.classList.toggle('dark'); localStorage.setItem('theme', isDark ? 'dark' : 'light'); updateMetaTheme(isDark); triggerHaptic('light'); const icon = document.getElementById('theme-icon'); if (icon) icon.className = isDark ? 'fas fa-sun text-yellow-400' : 'fas fa-moon text-gray-600'; }
        
        let lastScrollY = window.scrollY;
        window.addEventListener('scroll', () => { if(window.innerWidth >= 768) return; const header = document.getElementById('main-header'); if (window.scrollY > lastScrollY && window.scrollY > 50) header.classList.add('header-hide'); else header.classList.remove('header-hide'); lastScrollY = window.scrollY; }, { passive: true });
        
        function changeGridSize(cols) {
            const grid = document.getElementById('gallery-grid'); if (!grid) return; grid.className = 'grid gap-2 sm:gap-3 md:gap-4'; 
            if (cols === 2) grid.classList.add('grid-cols-2', 'sm:grid-cols-3', 'md:grid-cols-4', 'lg:grid-cols-5'); else if (cols === 4) grid.classList.add('grid-cols-2', 'sm:grid-cols-3', 'md:grid-cols-4', 'lg:grid-cols-6'); else if (cols === 6) grid.classList.add('grid-cols-3', 'sm:grid-cols-4', 'md:grid-cols-6', 'lg:grid-cols-8');
            document.querySelectorAll('.size-btn').forEach(btn => btn.classList.remove('active', 'bg-white', 'dark:bg-gray-700', 'text-gray-800', 'dark:text-white', 'shadow-sm')); const activeBtn = document.getElementById(`btn-grid-${cols}`); if(activeBtn) activeBtn.classList.add('active', 'bg-white', 'dark:bg-gray-700', 'text-gray-800', 'dark:text-white', 'shadow-sm'); triggerHaptic('light');
        }

        function resolveUrl(path, base = TARGET_URL) {
            if (!path) return ''; if (path.includes('/static/digital/')) return path.replace(/^.*\/static\/digital\//, 'https://pics.dmm.co.jp/digital/');
            if (path.startsWith('http')) return path; if (path.startsWith('//')) return 'https:' + path;
            let origin = TARGET_URL.replace(/\/$/, ''); try { if (base) origin = new URL(base).origin; } catch(e) {}
            return path.startsWith('/') ? origin + path : origin + '/' + path;
        }

        // Clean: ลดความซับซ้อนของการใช้ Proxy หลายตัว กลับมาใช้แบบธรรมดา
        async function fetchHtml(url) {
            const targetUrl = url.split('#')[0]; 
            if (pageCache.has(targetUrl)) return pageCache.get(targetUrl);
            
            try {
                // ใช้ proxy พื้นฐานตัวเดียวเพื่อหลีกเลี่ยงปัญหา CORS พื้นฐาน
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error('HTTP Error');
                
                const data = await response.json();
                if (data && data.contents) {
                    const htmlContent = data.contents;
                    pageCache.set(targetUrl, htmlContent);
                    return htmlContent;
                }
                throw new Error("Empty content");
            } catch (e) {
                console.error("Fetch error:", e);
                throw new Error("Failed to fetch HTML");
            }
        }

        // Clean: ใช้ Tag img แบบปกติ ไม่มีระบบ Fallback วนลูปที่ซับซ้อน
        function getSimpleImgTag(url, classNames) {
            if (!url) return `<div class="${classNames} bg-gray-200 dark:bg-gray-800"></div>`;
            let cleanUrl = url;
            if (cleanUrl.includes('/static/digital/')) {
                cleanUrl = cleanUrl.replace(/^.*\/static\/digital\//, 'https://pics.dmm.co.jp/digital/');
            }
            return `<img src="${cleanUrl}" class="${classNames} bg-gray-200 dark:bg-gray-700 transition-opacity duration-300" style="opacity:0;" loading="lazy" onload="this.classList.remove('bg-gray-200', 'dark:bg-gray-700'); this.style.opacity=1;" onerror="this.src='https://placehold.co/400x600?text=Error'; this.style.opacity=1;">`;
        }

        async function loadPage(url) {
            if (!isNavigatingHistory) { 
                historyStack = historyStack.slice(0, historyIndex + 1); 
                historyStack.push(url); 
                historyIndex = historyStack.length - 1; 
            }
            updateNavigationButtonsUI(); 
            currentUrl = url;
            const activeUrlDisplay = document.getElementById('display-active-url'); 
            if (activeUrlDisplay) activeUrlDisplay.innerText = url;
            updateCurrentPageBookmarkButtonUI();

            let showPagination = false;
            try {
                let urlObj = new URL(url); 
                let isDetail = urlObj.pathname.includes('/video/') || urlObj.searchParams.has('id');
                if (!isDetail) { 
                    if (urlObj.searchParams.has('page') || urlObj.hostname.includes('jvrlibrary.com') || url.match(/\/(\d+)\/?$/) || url === TARGET_URL || url === TARGET_URL.replace(/\/$/, '')) { 
                        currentPage = parseInt(urlObj.searchParams.get('page')) || parseInt((url.match(/\/(\d+)\/?$/)||[])[1]) || 1; 
                        showPagination = true; 
                    } 
                }
            } catch(e) {}

            const paginationEl = document.getElementById('pagination');
            if (paginationEl) { 
                if (showPagination) { 
                    paginationEl.classList.remove('hidden'); 
                    paginationEl.classList.add('flex'); 
                    document.getElementById('page-number').innerText = currentPage; 
                    document.getElementById('btn-prev').disabled = (currentPage <= 1); 
                } else {
                    paginationEl.classList.add('hidden'); 
                }
            }

            const grid = document.getElementById('gallery-grid');
            if (grid) grid.innerHTML = '<div class="col-span-full py-24 text-center"><i class="fas fa-circle-notch fa-spin text-4xl text-primary mb-3"></i><p class="text-xs font-bold text-gray-500 mt-2">กำลังดึงข้อมูล...</p></div>';

            try {
                const html = await fetchHtml(url); 
                const doc = new DOMParser().parseFromString(html, 'text/html');
                const items = []; 
                const seen = new Set();

                doc.querySelectorAll('a').forEach(a => {
                    const img = a.querySelector('img'); 
                    if (!img) return;
                    let rawSrc = img.getAttribute('data-original') || img.getAttribute('data-src') || img.getAttribute('src');
                    if (!rawSrc || rawSrc.includes('logo') || rawSrc.includes('banner')) return;
                    
                    let src = resolveUrl(rawSrc, url); 
                    let title = img.getAttribute('title') || img.getAttribute('alt') || a.innerText.trim() || 'Untitled';
                    let href = resolveUrl(a.getAttribute('href'), url);
                    
                    const idMatch = title.match(/([a-zA-Z]{2,8}-?\d{2,6}|\d{2,4}[a-zA-Z]{2,8}-?\d{2,6}|fc2-?[a-zA-Z]+-?\d{2,7})/i);
                    const id = idMatch ? idMatch[0].toUpperCase() : null;
                    
                    if (id && !seen.has(id)) { 
                        seen.add(id); 
                        items.push({ id, title, thumb: src, url: href }); 
                    }
                });

                if(items.length === 0) throw new Error("No items found");
                renderGridFast(items);
            } catch (e) {
                if (grid) grid.innerHTML = `<div class="col-span-full py-20 text-center text-red-500"><i class="fas fa-exclamation-triangle text-4xl mb-3"></i><br><span class="font-bold text-sm">ไม่สามารถโหลดข้อมูลได้</span><button onclick="loadPage('${escapeQuotes(url)}')" class="mt-4 px-6 py-2.5 bg-primary text-white rounded-full text-xs font-bold shadow-md active:scale-95"><i class="fas fa-redo mr-2"></i> ลองใหม่</button></div>`;
            }
        }

        function renderGridFast(items) {
            const grid = document.getElementById('gallery-grid'); if (!grid) return;
            grid.innerHTML = items.map(item => {
                const safeId = String(item.id || '').replace(/\s+/g, '_'); 
                const uniqueKey = item.isSnapshot ? `snapshot_${item.parentId}_${item.snapshotIndex}` : safeId;
                const isFav = favoriteList.some(f => f.isSnapshot ? (f.parentId === item.parentId && f.thumb === item.thumb) : f.id === item.id);
                return `
                    <div class="gallery-card bg-white dark:bg-gray-800 rounded-xl overflow-hidden shadow-sm relative flex flex-col border border-gray-100 dark:border-gray-700/50" id="item-card-${uniqueKey}">
                        <div onclick="handleCardClick('${item.id}', '${item.url}', '${item.thumb}', '${escapeQuotes(item.title)}', ${item.isSnapshot || false}, '${item.parentId || ''}', ${item.snapshotIndex || 0})" class="bg-gray-100 dark:bg-gray-900 relative pb-[145%]"><div class="absolute inset-0">${getSimpleImgTag(item.thumb, "w-full h-full object-cover")}</div></div>
                        <button onclick="toggleFavorite(event, '${item.id}', '${escapeQuotes(item.title)}', '${item.thumb}', '${item.url}', ${item.isSnapshot || false}, '${item.parentId || ''}', ${item.snapshotIndex || 0})" class="absolute top-2 right-2 z-10 w-8 h-8 rounded-full bg-black/50 backdrop-blur-sm text-white flex items-center justify-center active:scale-90 transition-transform"><i class="${isFav ? 'fas text-red-500' : 'far'} fa-heart text-sm drop-shadow-md"></i></button>
                        <div class="p-2 flex-grow flex flex-col"><div class="text-[9px] sm:text-[10px] font-bold text-primary mb-0.5">${item.isSnapshot ? `${item.parentId} (#${item.snapshotIndex})` : item.id}</div><div class="text-[10px] sm:text-xs line-clamp-2 dark:text-gray-200 font-medium leading-snug mb-1">${item.title}</div></div>
                    </div>`;
            }).join('');
        }

        function handleCardClick(id, url, thumb, title, isSnapshot, parentId, snapshotIndex) {
            triggerHaptic('light');
            if (isSnapshot) {
                const favSnapshots = [...favoriteList].sort((a,b) => b.timestamp - a.timestamp).filter(f => f.isSnapshot);
                currentImages = favSnapshots.map(f => f.thumb); const clickedIndex = favSnapshots.findIndex(f => f.parentId === parentId && f.thumb === thumb);
                if (clickedIndex > -1) openFullImgModal(clickedIndex); else { currentImages = [thumb]; openFullImgModal(0); }
            } else {
                openModal(id, url, thumb, title);
            }
        }

        function triggerDirectScan(id, url) { openModal(id, url, '', ''); }
        function navPage(direction) {
            triggerHaptic('light');
            try {
                let urlObj = new URL(currentUrl);
                if (urlObj.hostname.includes('jvrlibrary.com') || urlObj.searchParams.has('page')) { let newPage = parseInt(urlObj.searchParams.get('page') || "1") + direction; if (newPage < 1) newPage = 1; urlObj.searchParams.set('page', newPage); window.scrollTo({ top: 0, behavior: 'smooth' }); loadPage(urlObj.toString()); return; }
                const pageMatch = currentUrl.match(/\/(\d+)\/?$/); if (pageMatch) { let newPage = parseInt(pageMatch[1]) + direction; if (newPage < 1) newPage = 1; window.scrollTo({ top: 0, behavior: 'smooth' }); loadPage(currentUrl.replace(/\/\d+\/?$/, `/${newPage}`)); return; }
                if (currentUrl === TARGET_URL || currentUrl === TARGET_URL.replace(/\/$/, '')) { if (direction > 0) { window.scrollTo({ top: 0, behavior: 'smooth' }); loadPage(`${TARGET_URL}list/release_date/2`); } }
            } catch(e) {}
        }
        function goHome() { switchMainTab('home'); changeGridSize(4); loadPage(TARGET_URL); triggerHaptic('light'); window.scrollTo(0,0); }
        function loadLatest() { switchMainTab('home'); changeGridSize(4); loadPage(`${TARGET_URL}list/release_date/1`); triggerHaptic('light'); window.scrollTo(0,0); }
        function triggerDirectSearch(name, url) { closeModal(); loadPage(resolveUrl(url)); window.scrollTo(0,0); }
        function clearHistory() { if(confirm('ล้างประวัติย้อนกลับทั้งหมด?')) { pageCache.clear(); historyStack=[currentUrl]; historyIndex=0; updateNavigationButtonsUI(); showToast("ล้างประวัติสำเร็จ", "success"); } }

        function switchMainTab(tab) {
            activeMainTab = tab; triggerHaptic('light');
            const navHome = document.getElementById('nav-btn-home'); const navFav = document.getElementById('nav-btn-fav');
            if(navHome) navHome.className = `flex flex-col items-center p-2 w-1/5 active:scale-95 transition-transform ${tab === 'home' ? 'text-primary' : 'text-gray-400 dark:text-gray-500'}`;
            if(navFav) navFav.className = `flex flex-col items-center p-2 w-1/5 active:scale-95 transition-transform relative ${tab === 'favorites' ? 'text-primary' : 'text-gray-400 dark:text-gray-500'}`;
            const tabHome = document.getElementById('tab-home'); const tabFav = document.getElementById('tab-fav');
            if (tabHome) tabHome.className = `px-4 py-1.5 rounded-md font-bold transition-all ${tab==='home'?'bg-white dark:bg-gray-700 shadow-sm text-primary':'text-gray-500'}`;
            if (tabFav) tabFav.className = `px-4 py-1.5 rounded-md font-bold transition-all ${tab==='favorites'?'bg-white dark:bg-gray-700 shadow-sm text-primary':'text-gray-500'}`;
            const favFilter = document.getElementById('favorites-filter-container'); const bulkBar = document.getElementById('fav-bulk-action-bar'); const pag = document.getElementById('pagination');
            if (tab === 'home') { if (favFilter) favFilter.classList.add('hidden'); if (bulkBar) bulkBar.classList.add('hidden'); if (pag) pag.classList.remove('hidden'); loadPage(currentUrl); } 
            else if (tab === 'favorites') { if (pag) pag.classList.add('hidden'); renderFavoritesPage(); }
        }

        function navigateHistoryBack() { if (historyIndex > 0) { triggerHaptic('light'); isNavigatingHistory = true; historyIndex--; loadPage(historyStack[historyIndex]).finally(() => isNavigatingHistory = false); } }
        function navigateHistoryForward() { if (historyIndex < historyStack.length - 1) { triggerHaptic('light'); isNavigatingHistory = true; historyIndex++; loadPage(historyStack[historyIndex]).finally(() => isNavigatingHistory = false); } }
        function updateNavigationButtonsUI() {
            const btnBack = document.getElementById('btn-nav-back'); const btnForward = document.getElementById('btn-nav-forward'); if (!btnBack || !btnForward) return;
            if (historyIndex > 0) { btnBack.disabled = false; btnBack.classList.remove('text-gray-400', 'cursor-not-allowed'); btnBack.classList.add('text-gray-700', 'dark:text-white', 'active:bg-white', 'dark:active:bg-gray-700'); } 
            else { btnBack.disabled = true; btnBack.className = "w-10 h-8 flex items-center justify-center rounded-md font-bold transition-all text-gray-400 cursor-not-allowed"; }
            if (historyIndex < historyStack.length - 1) { btnForward.disabled = false; btnForward.classList.remove('text-gray-400', 'cursor-not-allowed'); btnForward.classList.add('text-gray-700', 'dark:text-white', 'active:bg-white', 'dark:active:bg-gray-700'); } 
            else { btnForward.disabled = true; btnForward.className = "w-10 h-8 flex items-center justify-center rounded-md font-bold transition-all text-gray-400 cursor-not-allowed"; }
        }

        function loadBookmarks() { try { bookmarkList = JSON.parse(localStorage.getItem('jav_bookmarks')) || []; } catch(e) { bookmarkList = []; } updateBookmarkBadgeUI(); renderBookmarkListUI(); if (gasEndpoint) syncBookmarksFromGoogleSheet(); }
        function updateBookmarkBadgeUI() {
            const badgeDesktop = document.getElementById('bookmark-badge'); const badgeMobile = document.getElementById('bookmark-badge-mobile'); const count = bookmarkList.length;
            if (badgeDesktop) { badgeDesktop.innerText = count; count > 0 ? badgeDesktop.classList.remove('hidden') : badgeDesktop.classList.add('hidden'); }
            if (badgeMobile) { badgeMobile.innerText = count; count > 0 ? badgeMobile.classList.remove('hidden') : badgeMobile.classList.add('hidden'); }
        }
        function updateCurrentPageBookmarkButtonUI() {
            const btn = document.getElementById('btn-bookmark-current'); const icon = document.getElementById('bookmark-current-icon'); if (!btn || !icon) return; 
            const isBookmarked = bookmarkList.some(b => b.url === currentUrl);
            if (isBookmarked) { icon.className = "fas fa-star text-yellow-500"; btn.className = "w-8 h-8 rounded-full bg-yellow-100 dark:bg-yellow-900/50 text-yellow-500 flex items-center justify-center border border-yellow-300 dark:border-yellow-600 active:scale-90 transition-all shadow-inner"; } 
            else { icon.className = "far fa-star text-gray-400"; btn.className = "w-8 h-8 rounded-full bg-gray-50 dark:bg-gray-800 text-gray-400 flex items-center justify-center border border-gray-200 dark:border-gray-700 active:scale-90 transition-all"; }
        }
        function toggleCurrentPageBookmark() {
            triggerHaptic('medium'); const existingIndex = bookmarkList.findIndex(b => b.url === currentUrl); let title = "หน้าเว็บเป้าหมาย";
            if (currentUrl.includes('/star/')) title = `นักแสดง: ${(decodeURIComponent(currentUrl).match(/\/star\/([^\/]+)/)||[])[1]}`; else if (currentUrl.includes('/company/')) title = `ค่าย: ${(decodeURIComponent(currentUrl).match(/\/company\/([^\/]+)/)||[])[1]}`; else if (currentUrl.includes('search?sn=')) title = `ค้นหา: ${(decodeURIComponent(currentUrl).match(/sn=([^&]+)/)||[])[1]}`; else if (currentUrl === TARGET_URL) title = "หน้าแรกอัพเดทล่าสุด";
            let actionType = 'add'; if (existingIndex > -1) { bookmarkList.splice(existingIndex, 1); actionType = 'remove'; } else bookmarkList.push({ title, url: currentUrl, timestamp: Date.now() });
            localStorage.setItem('jav_bookmarks', JSON.stringify(bookmarkList)); updateBookmarkBadgeUI(); updateCurrentPageBookmarkButtonUI(); renderBookmarkListUI();
            if (gasEndpoint) syncBookmarkToGoogleSheet(title, currentUrl, actionType);
        }
        function toggleBookmarkPanel() { triggerHaptic('light'); const panel = document.getElementById('bookmark-panel'); if (panel) panel.classList.toggle('translate-x-full'); }
        function renderBookmarkListUI() {
            const listEl = document.getElementById('bookmark-list'); if (!listEl) return;
            if (bookmarkList.length === 0) { listEl.innerHTML = `<div class="py-12 text-center text-gray-400"><i class="far fa-star text-3xl mb-2"></i><p class="text-xs">ไม่มีลิงก์ที่บันทึกไว้</p></div>`; return; }
            listEl.innerHTML = [...bookmarkList].sort((a,b) => b.timestamp - a.timestamp).map(b => `
                <div class="flex items-center justify-between gap-2 p-2 bg-gray-50 dark:bg-gray-900 rounded-lg border border-gray-100 dark:border-gray-800">
                    <div onclick="toggleBookmarkPanel(); switchMainTab('home'); loadPage('${b.url}');" class="flex-1 overflow-hidden cursor-pointer p-1"><p class="text-[11px] font-bold text-gray-800 dark:text-gray-200 truncate">${b.title}</p><p class="text-[9px] text-gray-400 truncate">${b.url}</p></div>

        // Clean: ดึงไฟล์ออกแบบตรงไปตรงมา ไม่ต้องใช้เทคนิค Racing
        async function fetchImageBlob(url) {
            let cleanUrl = url;
            if (cleanUrl.startsWith('//')) cleanUrl = 'https:' + cleanUrl; 
            if (cleanUrl.includes('/static/digital/')) cleanUrl = cleanUrl.replace(/^.*\/static\/digital\//, 'https://pics.dmm.co.jp/digital/');
            
            try {
                const res = await fetch(cleanUrl);
                if (!res.ok) throw new Error('Network response was not ok');
                return await res.blob();
            } catch (error) {
                console.error("Download Error:", error);
                throw error;
            }
        }

        async function downloadSingleImage(url, filename) { 
            try { 
                showToast("กำลังโหลดไฟล์ภาพ...", "info"); 
                const blob = await fetchImageBlob(url); 
                const objUrl = URL.createObjectURL(blob); 
                const link = document.createElement('a'); 
                link.href = objUrl; 
                link.download = filename; 
                document.body.appendChild(link); 
                link.click(); 
                document.body.removeChild(link); 
                setTimeout(() => URL.revokeObjectURL(objUrl), 200); 
            } catch (err) { 
                showToast("ดาวน์โหลดไม่สำเร็จ กรุณากดค้างที่รูปภาพเพื่อบันทึกเอง", "warning"); 
            } 
        }

        async function downloadFilteredFavoritesIndividually() { 
            if (!currentlyRenderedFavs || !currentlyRenderedFavs.length) return; 
            showToast("กำลังดาวน์โหลด กรุณารอสักครู่...", "info"); 
            for (let i = 0; i < currentlyRenderedFavs.length; i++) { 
                try { 
                    const item = currentlyRenderedFavs[i]; 
                    const blob = await fetchImageBlob(item.thumb); 
                    const filename = `${item.isSnapshot ? `scene_${item.parentId}_${item.snapshotIndex}` : `cover_${item.id}`}.jpg`; 
                    const objUrl = URL.createObjectURL(blob); 
                    const link = document.createElement('a'); link.href = objUrl; link.download = filename; 
                    document.body.appendChild(link); link.click(); document.body.removeChild(link); 
                    setTimeout(() => URL.revokeObjectURL(objUrl), 200); 
                    await new Promise(r => setTimeout(r, 300)); 
                } catch(e) {} 
            } 
            showToast("ดาวน์โหลดทั้งหมดเสร็จสิ้น", "success"); 
        }

        async function downloadFilteredFavoritesZip() { 
            if (!currentlyRenderedFavs || !currentlyRenderedFavs.length) return; 
            const zip = new JSZip(); 
            showToast("กำลังสร้าง ZIP รอสักครู่...", "info"); 
            try { 
                for (let i = 0; i < currentlyRenderedFavs.length; i++) { 
                    const item = currentlyRenderedFavs[i]; 
                    const blob = await fetchImageBlob(item.thumb); 
                    zip.file(`${item.isSnapshot ? `scene_${item.parentId}_${item.snapshotIndex}` : `cover_${item.id}`}.jpg`, blob); 
                    await new Promise(r => setTimeout(r, 200)); 
                } 
                const content = await zip.generateAsync({type:"blob"}); 
                const objUrl = URL.createObjectURL(content); 
                const link = document.createElement('a'); link.href = objUrl; link.download = `Fav_Gallery.zip`; link.click(); 
                setTimeout(() => URL.revokeObjectURL(objUrl), 500); 
                showToast("สร้างไฟล์ ZIP สำเร็จ!", "success"); 
            } catch(e) { 
                showToast("เกิดข้อผิดพลาดขณะสร้าง ZIP", "error"); 
            } 
        }

        async function downloadAllIndividuallyModal() { 
            if (!currentImages || !currentImages.length) return; 
            const id = document.getElementById('m-id-header').innerText; 
            showToast(`เริ่มโหลด ${currentImages.length} รูป...`, "info"); 
            for (let i = 0; i < currentImages.length; i++) { 
                try {

                    const objUrl = URL.createObjectURL(blob); 
                    const link = document.createElement('a'); link.href = objUrl; link.download = `${id}_${i===0?'cover':'scene_'+i}.jpg`; 
                    document.body.appendChild(link); link.click(); document.body.removeChild(link); 
                    setTimeout(() => URL.revokeObjectURL(objUrl), 200); 
                    await new Promise(r => setTimeout(r, 300)); 
                } catch(e){} 
            } 
            showToast("โหลดรูปในหน้านี้สำเร็จแล้ว", "success"); 
        }

        async function downloadAllModal() { 
            if (!currentImages || !currentImages.length) return; 
            const zip = new JSZip(); 
            const id = document.getElementById('m-id-header').innerText; 
            const status = document.getElementById('m-count'); // ใช้พื้นที่บอกจำนวนรูปแทนการสร้าง element ใหม่
            const originalCountText = status.innerHTML;
            
            try { 
                for (let i = 0; i < currentImages.length; i++) { 
                    status.innerHTML = `<strong>ดึงรูป:</strong> ${i+1}/${currentImages.length}`; 
                    const blob = await fetchImageBlob(currentImages[i]); 
                    zip.file(`${id}_${i===0?'cover':'scene_'+i}.jpg`, blob); 
                    await new Promise(r => setTimeout(r, 200)); 
                } 
                status.innerHTML = `<strong>สร้างไฟล์ ZIP...</strong>`; 
                const content = await zip.generateAsync({type:"blob"}); 
                const objUrl = URL.createObjectURL(content); 
                const link = document.createElement('a'); link.href = objUrl; link.download = `${id}_Gallery.zip`; link.click(); 
                setTimeout(() => URL.revokeObjectURL(objUrl), 500); 
                status.innerHTML = `<strong>สำเร็จ!</strong>`; 
            } catch(e) { 
                status.innerHTML = `<strong>ผิดพลาด!</strong>`; 
            } 
            setTimeout(() => { status.innerHTML = originalCountText; }, 3000); 
        }

        function downloadAllIndividually() { downloadAllIndividuallyModal(); } 
        function downloadAll() { downloadAllModal(); }
